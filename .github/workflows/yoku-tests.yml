name: Yoku Tea tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/yoku/**"
      - "src/yoku_main.py"
      - "data/products/**"
      - "data/templates/**"
      - "data/media/**"
      - "data/motion/**"
      - "motion/**"
      - "scripts/extract_yoku_brand_fonts.py"
      - "scripts/yoku_chromium_path.mjs"
      - "package.json"
      - "package-lock.json"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_claims_guard.py"
      - "tests/test_cli.py"
      - "tests/test_product_catalog.py"
      - "tests/test_script_builder.py"
      - "tests/test_template_catalog.py"
      - "tests/test_yoku_catalog_v1.py"
      - "tests/test_storyboard_asset_pack.py"
      - "tests/test_approved_assets_video.py"
      - "tests/test_motion_renderer_v2.py"
      - ".github/workflows/yoku-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall src
      - name: Run isolated Yoku unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_claims_guard \
            tests.test_cli \
            tests.test_product_catalog \
            tests.test_script_builder \
            tests.test_template_catalog \
            tests.test_yoku_catalog_v1 \
            tests.test_storyboard_asset_pack \
            tests.test_approved_assets_video \
            tests.test_motion_renderer_v2 \
            2>&1 | tee yoku-test-output.txt
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoku-test-output
          path: yoku-test-output.txt
      - name: Verify asset catalogue
        run: |
          python src/yoku_main.py list-assets
          python src/yoku_main.py validate-assets --product taro-200g
      - name: Build storyboard drafts
        run: |
          tmp_dir="$(mktemp -d)"
          python src/yoku_main.py storyboard --product taro-200g --template ozon-recipe --output-dir "$tmp_dir"
          python src/yoku_main.py storyboard --product taro-200g --template ozon-objection --output-dir "$tmp_dir"
          python src/yoku_main.py storyboard --product taro-200g --template social-result --output-dir "$tmp_dir"
          test "$(find "$tmp_dir" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 3
      - name: Verify approved video dry run
        shell: bash
        run: |
          tmp_assets="$(mktemp -d)"
          tmp_output="$(mktemp -d)"
          TMP_ASSETS="$tmp_assets" python - <<'PY'
          import os
          import struct
          from pathlib import Path

          root = Path(os.environ["TMP_ASSETS"])
          folder = root / "assets/yoku/products/taro-100g"
          folder.mkdir(parents=True)
          payload = (
              b"\x89PNG\r\n\x1a\n"
              + struct.pack(">I", 13)
              + b"IHDR"
              + struct.pack(">II", 1080, 1440)
          )
          for name in (
              "packshot-front.png", "drink-hero.png", "preparation-01.png",
              "preparation-02.png", "product-detail.png", "cta-slide.png",
          ):
              (folder / name).write_bytes(payload)
          PY
          python src/yoku_main.py render-video \
            --product taro-100g \
            --template social-result \
            --assets-root "$tmp_assets" \
            --output-dir "$tmp_output" \
            --dry-run
          test "$(find "$tmp_output" -name render-plan.json | wc -l)" -eq 1
